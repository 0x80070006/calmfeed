  <defs>
    <linearGradient id="dusk" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#4F6CF7"/>
      <stop offset=".3" stop-color="#8E2DE2"/>
      <stop offset=".55" stop-color="#E1306C"/>
      <stop offset=".8" stop-color="#FF8A2B"/>
